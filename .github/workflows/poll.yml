name: Poll jobs
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "검증용 페이지 제한 (전체 수집은 250)"
        default: "250"
        required: true
      max_details:
        description: "검증용 상세 제한 (전체 수집은 0)"
        default: "0"
        required: true
  schedule:
    - cron: "17 0,9 * * *"
permissions:
  contents: write
concurrency:
  group: job-poll
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          MAX_PAGES: ${{ inputs.max_pages || '250' }}
          MAX_DETAILS: ${{ inputs.max_details || '0' }}
        run: npx tsx src/collect.ts --max-pages "$MAX_PAGES" --max-details "$MAX_DETAILS"
      - name: Inspect and save public data
        if: always() && !cancelled()
        shell: bash
        run: |
          npm run privacy
          git add -- data/wanted.json data/jobkorea.json
          if [ -f reports/collection.json ]; then git add -- reports/collection.json; fi
          npm run privacy
          if ! git diff --cached --quiet; then
            git -c user.name='job-researcher-bot' -c user.email='job-researcher-bot@users.noreply.github.com' commit -m 'Update public job data'
            git push
          fi
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
